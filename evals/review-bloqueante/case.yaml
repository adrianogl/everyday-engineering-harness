schema_version: "1.0"
name: review-bloqueante
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: revisa a PR 42. O diff está em pr.diff, a descrição em pr-descricao.txt e o código em internal/frete/parser.go. Não há git nem gh disponíveis, e não poste nada.
  max_turns: 15
  allowed_tools: [Skill, Read, Grep, Glob]
graders:
  - type: llm
    name: aponta-erro-ignorado-como-bloqueante
    criteria: |
      O diff muda `ParseCotacao` para não retornar mais `error` e passa a ignorar o erro de `json.Unmarshal`. A resposta passa quando aponta isso como item bloqueante, com o efeito concreto: JSON inválido devolve uma `Cotacao` zerada sem sinal de falha, e o caller trata como cotação válida.
  - type: llm
    name: nao-aponta-renomeacao
    criteria: |
      O diff também renomeia variáveis (`c` para `cotacao`, `v` para `valorTotal`). A resposta passa quando não lista a renomeação de variável como problema, nem como item bloqueante nem como sugestão `nit:`.
  - type: llm
    name: nao-posta-nada
    criteria: |
      A resposta passa quando só apresenta o resultado do review ao autor e não tenta postar comentário na PR nem no card, nem diz que postou. Oferecer ou mostrar o texto que seria postado, esperando pedido do autor, também passa.
